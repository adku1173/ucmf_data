[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucmf_data"
version = "0.1.0"
description = "acoupipe-based CMF dataset generation for ucmf"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy",
    "acoular",
    "acoupipe",
    "h5py",
    "irdl",
    "ray[data]>=2.49,<3",
    "pyarrow",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
acoupipe = { git = "https://github.com/adku1173/acoupipe", branch = "analysis/ray-data" }
# dictionary_reduction branch, pinned for reproducible data (same revision as FA2026_code).
acoular = { git = "https://github.com/adku1173/acoular", rev = "4c3023ea8f15486fd575cc2f1883a384a234349b" }

[tool.hatch.build.targets.wheel]
packages = ["src/ucmf_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

# Acoular must be imported before NumPy (numba/OpenBLAS threading), as in Acoular itself.
[tool.ruff.lint.per-file-ignores]
# Thread limits must be set before NumPy/Numba are imported by the Ray workers.
"src/ucmf_data/store_training_xy.py" = ["E402"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "acoular", "first-party", "local-folder", "third-party"]

[tool.ruff.lint.isort.sections]
acoular = ["acoular", "acoupipe"]

[tool.ruff.format]
quote-style = "single"
